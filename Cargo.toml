[package]
name = "chickadee"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
name = "chickadee"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.102"
crc32fast = "1.5.0"
dotenvy = "0.15.7"
thiserror = "2.0.18"
wincode = { version = "0.4.5", features = ["derive"] }
xxh3 = "0.1.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# never ship
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"
# no panics in non-test code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"
arithmetic_side_effects = "warn"
as_conversions = "warn"
