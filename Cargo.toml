[package]
name = "chickadee"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[lib]
name = "chickadee"
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.102"
crc32fast = "1.5.0"
dotenvy = "0.15.7"
thiserror = "2.0.18"
wincode = { version = "0.4.5", features = ["derive"] }
xxh3 = "0.1.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints that cost more than they catch.
module_name_repetitions = "allow"
# Library crates flip this to "warn": builders and pure functions get #[must_use].
must_use_candidate = "allow"

# Docs: # Errors and # Panics sections everywhere.
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# Never ship.
todo = "deny"
dbg_macro = "deny"
unimplemented = "deny"

# No panics outside tests (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
exit = "deny"

# Suppressions are #[expect] with a reason, so stale ones surface.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe explains itself, one operation per block.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# Casts and arithmetic that can silently lose information.
as_conversions = "warn"
arithmetic_side_effects = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
too_many_arguments = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
needless_collect = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"

# Logging goes through tracing; a CLI's own output takes an #[expect].
print_stdout = "warn"
print_stderr = "warn"
